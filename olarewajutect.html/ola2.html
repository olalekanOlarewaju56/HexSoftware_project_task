<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OlarewajuTech - AC & Fridge Repair Abuja</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #04090f;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 16px;
      font-family: 'Nunito', sans-serif;
    }

    .ad-wrap {
      background: linear-gradient(165deg, #07111f 0%, #0b1e36 55%, #0a2d4a 100%);
      border-radius: 22px;
      overflow: hidden;
      max-width: 560px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.07);
    }

    .top-banner {
      background: linear-gradient(90deg, #ea6500, #f97316, #ea6500);
      text-align: center;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hero { padding: 28px 28px 10px; text-align: center; }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .logo-icon {
      width: 68px; height: 68px;
      border-radius: 16px;
      overflow: hidden;
      flex-shrink: 0;
      background: #0d2240;
      border: 2px solid #f97316;
    }

    .biz-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px; color: #fff;
      letter-spacing: 2px; line-height: 1;
    }
    .biz-name span { color: #f97316; }

    .tagline {
      font-size: 12px; color: #7aaac8;
      margin-top: 5px; letter-spacing: 1px;
      text-transform: uppercase;
    }

    .headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 50px; color: #fff;
      line-height: 1; margin: 10px 0 6px;
    }
    .headline span { color: #f97316; }

    .sub {
      font-size: 13px; color: #7aaac8;
      margin-bottom: 24px; letter-spacing: 0.5px;
    }

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px; padding: 0 24px;
      margin-bottom: 22px;
    }

    .service-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px;
      padding: 16px 12px;
      text-align: center;
      transition: background 0.2s;
    }
    .service-card:hover { background: rgba(249,115,22,0.1); }
    .s-icon { font-size: 28px; margin-bottom: 7px; }
    .s-title { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 3px; }
    .s-desc { font-size: 11px; color: #7aaac8; }

    .pics-label {
      text-align: center; font-size: 11px;
      font-weight: 700; color: #f97316;
      letter-spacing: 2px; text-transform: uppercase;
      margin-bottom: 10px;
    }

    .pics-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px; padding: 0 24px;
      margin-bottom: 22px;
    }

    .pic-frame {
      border-radius: 14px; overflow: hidden;
      position: relative; background: #071626;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .pic-frame svg { display: block; width: 100%; }

    .pic-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(7,22,38,0.88);
      font-size: 11px; font-weight: 800;
      color: #f97316; text-align: center;
      padding: 6px; letter-spacing: 1px;
      text-transform: uppercase;
    }

    .features {
      display: flex; justify-content: space-around;
      padding: 0 16px 20px;
    }
    .feat { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .feat-dot { width: 9px; height: 9px; background: #f97316; border-radius: 50%; }
    .feat-text { font-size: 11px; color: #fff; font-weight: 700; text-align: center; line-height: 1.4; }

    .location-row {
      display: flex; align-items: center;
      justify-content: center; gap: 8px;
      margin: 0 24px 18px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px; padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.07);
    }
    .location-row span { font-size: 13px; color: #7aaac8; }
    .location-row strong { color: #fff; font-size: 13px; }

    .cta-section {
      padding: 0 24px 30px;
      display: flex; flex-direction: column;
      align-items: center; gap: 12px;
    }

    .wa-btn {
      display: flex; align-items: center;
      justify-content: center; gap: 10px;
      background: #25D366; color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: 17px; font-weight: 800;
      text-decoration: none; border-radius: 50px;
      padding: 16px 32px; width: 100%;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 24px rgba(37,211,102,0.25);
    }
    .wa-btn:hover { background: #1db954; transform: translateY(-1px); }
    .wa-btn:active { transform: scale(0.98); }

    .phone-text { font-size: 12px; color: #7aaac8; letter-spacing: 0.5px; text-align: center; }

    .footer {
      background: rgba(0,0,0,0.35);
      text-align: center; padding: 12px;
      font-size: 11px; color: #3a5a78;
      letter-spacing: 0.5px;
    }

    @keyframes drift {
      0%   { opacity: 0; transform: translateX(0) translateY(0); }
      40%  { opacity: 0.8; }
      100% { opacity: 0; transform: translateX(20px) translateY(-14px); }
    }
    .cold1 { animation: drift 2.4s ease-in-out infinite; }
    .cold2 { animation: drift 2.4s ease-in-out 0.6s infinite; }
    .cold3 { animation: drift 2.4s ease-in-out 1.2s infinite; }
  </style>
</head>
<body>
<div class="ad-wrap">

  <div class="top-banner">⚡ Fast Response &nbsp;·&nbsp; Abuja &nbsp;·&nbsp; Same Day Service ⚡</div>

  <div class="hero">
    <div class="logo-row">
      <div class="logo-icon">
        <svg viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">
          <rect width="68" height="68" fill="#0d1f38"/>
          <!-- AC unit left side -->
          <rect x="3" y="16" width="29" height="20" rx="4" fill="#c0d4e8" stroke="#90b0cc" stroke-width="1"/>
          <rect x="5" y="18" width="25" height="16" rx="3" fill="#d8eaf8"/>
          <rect x="5" y="18" width="25" height="6" rx="3" fill
